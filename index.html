<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards — Q&amp;A hoofdstukken</title>
<style>
  :root {
    --parchment: #f5f4ed;
    --ink: #141413;
    --terracotta: #c96442;
    --terracotta-dark: #b0552f;
    --marfim: #faf9f5;
    --coral: #d97757;
    --olive: #5e5d59;
    --stone: #87867f;
    --cream-border: #f0eee6;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--parchment);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1rem;
    line-height: 1.6;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  .container {
    width: 100%;
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 1.5rem;
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 100dvh;
  }
  header {
    padding: 1.5rem 0 1rem;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  h1 {
    font-family: Georgia, serif;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .header-tools {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  .counter {
    font-size: 0.875rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--olive);
    font-variant-numeric: tabular-nums;
  }
  select {
    font-family: Georgia, serif;
    font-size: 0.875rem;
    color: var(--ink);
    background: var(--marfim);
    border: 1px solid var(--cream-border);
    border-radius: var(--radius);
    padding: 0.4rem 0.6rem;
    max-width: 16rem;
    box-shadow: 0 0 0 1px var(--cream-border);
  }
  .progress-track {
    height: 3px;
    background: var(--cream-border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: var(--terracotta);
    transition: width 300ms ease-out;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 2rem 0 3rem;
  }
  .btn {
    font-family: Georgia, serif;
    font-weight: 600;
    font-size: 0.9375rem;
    border-radius: 0.5rem;
    padding: 12px 20px;
    cursor: pointer;
    transition: transform 200ms ease, box-shadow 200ms ease, background 200ms ease, filter 200ms ease;
  }
  .btn-primary {
    background: var(--terracotta);
    color: var(--marfim);
    border: none;
  }
  .btn-primary:hover { filter: brightness(0.92); box-shadow: 0 4px 14px rgba(201, 100, 66, 0.28); transform: scale(1.03); }
  .btn-primary:active { transform: translateY(1px); }
  .btn-ghost {
    background: transparent;
    color: var(--ink);
    border: 1.5px solid var(--olive);
  }
  .btn-ghost:hover { background: var(--cream-border); }
  .btn-ghost:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.4; cursor: default; transform: none; box-shadow: none; }

  /* Empty state / dropzone */
  #emptyState {
    margin: auto;
    max-width: 34rem;
    width: 100%;
    text-align: center;
    background: var(--marfim);
    border: 1.5px dashed var(--stone);
    border-radius: var(--radius);
    padding: clamp(2rem, 6vw, 4rem);
    box-shadow: 0 0 0 1px var(--cream-border), 0 2px 12px rgba(0, 0, 0, 0.06);
    transition: border-color 200ms ease, background 200ms ease;
  }
  body.dragover #emptyState, body.dragover #cardArea {
    border-color: var(--terracotta);
    background: #f3efe4;
  }
  #emptyState svg { color: var(--terracotta); margin-bottom: 1rem; }
  #emptyState h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
  #emptyState p { color: var(--olive); font-size: 0.9375rem; margin-bottom: 1.5rem; }

  /* Card */
  #cardArea { width: 100%; max-width: 46rem; margin: 0 auto; }
  .card-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 0.75rem;
    font-size: 0.875rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    color: var(--olive);
  }
  .card-meta .vid { color: var(--terracotta); }
  .card {
    background: var(--marfim);
    border-radius: var(--radius);
    border: 1px solid var(--cream-border);
    box-shadow: 0 0 0 1px var(--cream-border), 0 2px 12px rgba(0, 0, 0, 0.06);
    padding: clamp(1.5rem, 4vw, 3rem);
    min-height: 16rem;
    display: flex;
    flex-direction: column;
  }
  .card.enter { animation: fadeUp 540ms ease-out; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #question {
    font-size: clamp(1.375rem, 3vw, 1.75rem);
    font-weight: 700;
    line-height: 1.35;
    letter-spacing: -0.01em;
  }
  #revealBtn { align-self: center; margin-top: 1.5rem; }
  #answer {
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--cream-border);
    font-size: 1.0625rem;
    line-height: 1.6;
    max-height: 45vh;
    overflow-y: auto;
  }
  #answer.hidden { display: none; }
  #answer.reveal { animation: fadeUp 400ms ease-out; }
  #answer p { margin-bottom: 0.75rem; max-width: 72ch; }
  #answer ul, #answer ol { margin: 0 0 0.75rem 1.25rem; }
  #answer li { margin-bottom: 0.35rem; max-width: 68ch; }
  #answer strong { color: var(--terracotta-dark); }
  .card-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-top: 1.25rem;
  }
  .nav-hint {
    font-size: 0.8125rem;
    color: var(--stone);
    letter-spacing: 0.03em;
    text-align: center;
  }
  @media (max-width: 768px) {
    .nav-hint { display: none; }
    #cardArea { max-width: 100%; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Flashcards</h1>
    <div class="header-tools">
      <span class="counter" id="counter">0 / 0</span>
      <select id="deckSelect" hidden></select>
      <button class="btn btn-primary" id="loadBtn">Laad .md-bestanden</button>
      <input type="file" id="fileInput" accept=".md,.markdown,.txt" multiple hidden>
    </div>
  </header>
  <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
  <main>
    <div id="emptyState">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      <h2>Nog geen bestanden geladen</h2>
      <p>Sleep je Q&amp;A-<code>.md</code>-bestanden hierheen, of kies ze via de knop rechtsboven.</p>
      <button class="btn btn-primary" id="emptyLoadBtn">Kies bestanden</button>
    </div>
    <div id="cardArea" hidden>
      <div class="card-meta">
        <span id="sectionLabel"></span>
        <span class="vid" id="vidLabel"></span>
      </div>
      <div class="card" id="card">
        <div id="question"></div>
        <button class="btn btn-primary" id="revealBtn">Toon antwoord</button>
        <div id="answer" class="hidden"></div>
      </div>
      <div class="card-nav">
        <button class="btn btn-ghost" id="prevBtn">&#8592; Vorige</button>
        <span class="nav-hint">&#8592; &#8594; of scroll = volgende/vorige &middot; spatie = toon antwoord</span>
        <button class="btn btn-ghost" id="nextBtn">Volgende &#8594;</button>
      </div>
    </div>
  </main>
</div>
<script>
function parseMarkdown(text) {
  const lines = text.split(/\r?\n/);
  const cards = [];
  let section = '';
  let card = null;
  for (const line of lines) {
    const h2 = line.match(/^##\s+(.+?)\s*$/);
    if (h2) { section = h2[1]; card = null; continue; }
    const q = line.match(/^\*\*(V\d+)\.\s*(.+?)\*\*\s*$/);
    if (q) {
      if (card) cards.push(card);
      card = { id: q[1], question: q[2], answerLines: [], section: section };
      continue;
    }
    if (card) {
      const a = line.match(/^>\s?(.*)$/);
      if (a) {
        let content = a[1];
        if (card.answerLines.length === 0) content = content.replace(/^\*\*A\.\*\*\s?/, '');
        card.answerLines.push(content);
      } else if (line.trim() !== '') {
        if (card) { cards.push(card); card = null; }
      }
    }
  }
  if (card) cards.push(card);
  return cards;
}

function inlineMd(s) {
  return s
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>');
}

function renderAnswer(lines) {
  let html = '';
  let listType = null;
  const closeList = () => { if (listType) { html += '</' + listType + '>'; listType = null; } };
  for (const raw of lines) {
    const t = raw.trim();
    if (!t) { closeList(); continue; }
    let m;
    if ((m = t.match(/^-\s+(.*)$/))) {
      if (listType !== 'ul') { closeList(); html += '<ul>'; listType = 'ul'; }
      html += '<li>' + inlineMd(m[1]) + '</li>';
    } else if ((m = t.match(/^\d+\.\s+(.*)$/))) {
      if (listType !== 'ol') { closeList(); html += '<ol>'; listType = 'ol'; }
      html += '<li>' + inlineMd(m[1]) + '</li>';
    } else {
      closeList();
      html += '<p>' + inlineMd(t) + '</p>';
    }
  }
  closeList();
  return html;
}

if (typeof document !== 'undefined') {
  const $ = (id) => document.getElementById(id);
  const emptyState = $('emptyState'), cardArea = $('cardArea');
  const counter = $('counter'), progressBar = $('progressBar');
  const deckSelect = $('deckSelect'), sectionLabel = $('sectionLabel'), vidLabel = $('vidLabel');
  const cardEl = $('card'), questionEl = $('question'), answerEl = $('answer'), revealBtn = $('revealBtn');
  const prevBtn = $('prevBtn'), nextBtn = $('nextBtn');
  const fileInput = $('fileInput');

  let decks = [];
  let cards = [];
  let index = 0;
  let locked = false;

  function rebuild() {
    cards = [];
    decks.forEach((d) => d.cards.forEach((c) => cards.push({ ...c, file: d.name })));
    deckSelect.innerHTML = '';
    decks.forEach((d, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = d.name.replace(/\.md$/i, '') + ' (' + d.cards.length + ')';
      deckSelect.appendChild(opt);
    });
    const has = cards.length > 0;
    emptyState.hidden = has;
    cardArea.hidden = !has;
    deckSelect.hidden = !has || decks.length < 2;
    index = 0;
    if (has) render();
  }

  function render() {
    const c = cards[index];
    counter.textContent = (index + 1) + ' / ' + cards.length;
    progressBar.style.width = (((index + 1) / cards.length) * 100) + '%';
    sectionLabel.textContent = (c.file ? c.file.replace(/\.md$/i, '') + ' — ' : '') + (c.section || '');
    vidLabel.textContent = c.id;
    questionEl.innerHTML = inlineMd(c.question);
    answerEl.innerHTML = renderAnswer(c.answerLines);
    answerEl.classList.add('hidden');
    answerEl.classList.remove('reveal');
    revealBtn.textContent = 'Toon antwoord';
    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === cards.length - 1;
    cardEl.classList.remove('enter');
    void cardEl.offsetWidth;
    cardEl.classList.add('enter');
  }

  function go(dir) {
    const next = Math.min(Math.max(index + dir, 0), cards.length - 1);
    if (next !== index) { index = next; render(); }
  }
  function toggleAnswer() {
    const hidden = answerEl.classList.contains('hidden');
    answerEl.classList.toggle('hidden', !hidden);
    answerEl.classList.toggle('reveal', hidden);
    revealBtn.textContent = hidden ? 'Verberg antwoord' : 'Toon antwoord';
  }
  function lockNav() {
    locked = true;
    setTimeout(() => { locked = false; }, 350);
  }

  async function addFiles(fileList) {
    const files = [...fileList]
      .filter((f) => /\.(md|markdown|txt)$/i.test(f.name))
      .sort((a, b) => a.name.localeCompare(b.name));
    for (const f of files) {
      const text = await f.text();
      const parsed = parseMarkdown(text);
      if (parsed.length) decks.push({ name: f.name, cards: parsed });
    }
    rebuild();
  }

  $('loadBtn').addEventListener('click', () => fileInput.click());
  $('emptyLoadBtn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });

  window.addEventListener('dragover', (e) => { e.preventDefault(); document.body.classList.add('dragover'); });
  window.addEventListener('dragleave', (e) => { if (e.relatedTarget === null) document.body.classList.remove('dragover'); });
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    document.body.classList.remove('dragover');
    if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  prevBtn.addEventListener('click', () => go(-1));
  nextBtn.addEventListener('click', () => go(1));
  revealBtn.addEventListener('click', toggleAnswer);
  cardEl.addEventListener('click', (e) => { if (e.target === cardEl || e.target === questionEl) toggleAnswer(); });

  deckSelect.addEventListener('change', () => {
    const first = cards.findIndex((c) => c.file === decks[deckSelect.value].name);
    if (first >= 0) { index = first; render(); }
  });

  document.addEventListener('keydown', (e) => {
    if (cardArea.hidden) return;
    if (e.key === 'ArrowRight') { go(1); }
    else if (e.key === 'ArrowLeft') { go(-1); }
    else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggleAnswer(); }
  });

  cardArea.addEventListener('wheel', (e) => {
    const ans = answerEl;
    if (!ans.classList.contains('hidden') && e.target.closest('#answer') && ans.scrollHeight > ans.clientHeight) {
      const atTop = ans.scrollTop <= 0 && e.deltaY < 0;
      const atBottom = ans.scrollTop + ans.clientHeight >= ans.scrollHeight - 1 && e.deltaY > 0;
      if (!atTop && !atBottom) return;
    }
    e.preventDefault();
    if (locked) return;
    lockNav();
    (e.deltaY > 0 || e.deltaX > 0) ? go(1) : go(-1);
  }, { passive: false });

  let touchX = null;
  cardArea.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; }, { passive: true });
  cardArea.addEventListener('touchend', (e) => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
    touchX = null;
  }, { passive: true });
}
</script>
</body>
</html>
